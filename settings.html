<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <!-- Mobile Fix: No zoom, perfect responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <meta name="application-name" content="VNF family-shop-v1">
  <title>Settings</title>

  <style>
    /* Smooth transitions */
    body, button, a {
      transition: all 0.25s ease;
    }

    /* Light / Dark Mode */
    body.light { background:#f8fafc; color:#1e293b; }
    body.dark  { background:#0f172a; color:#e2e8f0; }

    /* Premium header */
    .vnf-header {
      text-align:center;
      font-size:24px;
      font-weight:800;
      margin-top:25px;
      margin-bottom:25px;
      opacity:0.9;
      letter-spacing:0.5px;
    }

    /* Main container (PREMIUM MOBILE FIX) */
    .vnf-container {
      max-width:480px;
      margin:0 auto;
      padding:12px;
      text-align:center;
    }

    /* Buttons */
    button {
      padding:12px 18px;
      border:none;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
      margin:8px;
      box-shadow:0 2px 6px rgba(0,0,0,0.15);
    }

    button:hover {
      transform:scale(1.03);
      box-shadow:0 4px 10px rgba(0,0,0,0.25);
    }

    /* Settings box */
    .settings-box {
      background:#ffffff;
      padding:15px;
      margin:10px 0;
      border-radius:10px;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);
      text-align:left;
    }

    body.dark .settings-box {
      background:#1e293b;
      color:#e2e8f0;
    }

    /* Mobile polish */
    @media (max-width: 480px) {
      .vnf-header { font-size:20px; }
      button { padding:10px 14px; }
      body { font-size:14px; }
    }

    footer {
      margin-top:30px;
      font-size:12px;
      color:#777;
      text-align:center;
      line-height:1.4;
    }
  </style>
</head>

<body class="light">

<div class="vnf-container">

  <div class="vnf-header">Settings</div>

  <div class="settings-box">
    <strong>Language</strong><br>
    <select id="langSelect" style="margin-top:10px; padding:8px; border-radius:8px;">
      <option value="en">English</option>
      <option value="el">Greek</option>
      <option value="fr">French</option>
    </select>
  </div>

  <div class="settings-box">
    <strong>Theme</strong><br>
    <button onclick="toggleMode()" style="margin-top:10px;">Light / Dark Mode</button>
  </div>

  <div class="settings-box">
    <strong>Family Code</strong><br>
    <p id="familyCode" style="margin-top:10px;">FNF-TEST-001</p>
  </div>

  <div class="settings-box">
    <strong>Device ID</strong><br>
    <p id="deviceId" style="margin-top:10px;">dev-001</p>
  </div>

  <div class="bottom-buttons">
    <button onclick="window.location.href='dashboard.html'" style="background:#38bdf8; color:white;">Back to Dashboard</button>
    <button onclick="window.location.href='login.html'" style="background:#475569; color:white;">Back to Login</button>
  </div>

  <footer>
    © 2026 VNF Software — Created by Vasilis Fanes Nikitaras.<br>
    Unauthorized copying or resale is strictly prohibited.<br>
    Contact: vasilis.nikitaras@gmail.com
  </footer>

</div>

<script>
  // Protection
  if (localStorage.getItem("vnf_auth") !== "ok") {
    window.location.href = "login.html";
  }

  // Light / Dark Mode
  function toggleMode() {
    const mode = localStorage.getItem("vnf_mode") === "dark" ? "light" : "dark";
    localStorage.setItem("vnf_mode", mode);
    document.body.className = mode;
  }

  document.body.className = localStorage.getItem("vnf_mode") || "light";

  // Language selector
  const langSelect = document.getElementById("langSelect");
  langSelect.value = localStorage.getItem("vnf_lang") || "en";

  langSelect.onchange = () => {
    localStorage.setItem("vnf_lang", langSelect.value);
    alert("Language changed to: " + langSelect.value);
  };
</script>

</body>
</html>
