<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Mobile Perfect Scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- PWA Requirements -->
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">

  <meta name="application-name" content="VNF family-shop-v1">
  <title>Home</title>

  <style>
    /* --- VNF FINAL POLISH PACK v1 --- */

    body, button, a {
      transition: all 0.25s ease;
    }

    /* Light / Dark Mode */
    body.light { background:#f8fafc; color:#1e293b; }
    body.dark  { background:#0f172a; color:#e2e8f0; }

    /* Premium header */
    .vnf-header {
      text-align:center;
      font-size:24px;
      font-weight:800;
      margin-top:25px;
      margin-bottom:25px;
      opacity:0.9;
      letter-spacing:0.5px;
    }

    /* Main container (PREMIUM MOBILE FIX) */
    .vnf-container {
      max-width:480px;
      margin:0 auto;
      padding:12px;
      text-align:center;
    }

    /* Buttons */
    button {
      padding:12px 18px;
      border:none;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
      margin:8px;
      box-shadow:0 2px 6px rgba(0,0,0,0.15);
    }

    button:hover {
      transform:scale(1.03);
      box-shadow:0 4px 10px rgba(0,0,0,0.25);
    }

    /* Mobile polish */
    @media (max-width: 480px) {
      .vnf-header { font-size:20px; }
      button { padding:10px 14px; }
      body { font-size:14px; }
    }

    footer {
      margin-top:30px;
      font-size:12px;
      color:#777;
      text-align:center;
      line-height:1.4;
    }
  </style>
</head>

<body class="light">

<div class="vnf-container">

  <div class="vnf-header">VNF Family Shop v1</div>

  <div class="content">
    <h1 id="welcomeMsg">Welcome</h1>
    <p id="descMsg">A simple protected demo system with dashboard and pages.</p>

    <button onclick="window.location.href='login.html'" style="background:#38bdf8; color:white;">Login</button>
    <button onclick="window.location.href='dashboard.html'" style="background:#475569; color:white;">Dashboard</button>
  </div>

  <div class="bottom-buttons">
    <button onclick="toggleMode()">Light / Dark Mode</button>
  </div>

  <footer>
    © 2026 VNF Software — Created by Vasilis Fanes Nikitaras.<br>
    Unauthorized copying or resale is strictly prohibited.<br>
    Contact: vasilis.nikitaras@gmail.com
  </footer>

</div>

<script>
  // Light / Dark Mode
  function toggleMode() {
    const mode = localStorage.getItem("vnf_mode") === "dark" ? "light" : "dark";
    localStorage.setItem("vnf_mode", mode);
    document.body.className = mode;
  }

  document.body.className = localStorage.getItem("vnf_mode") || "light";

  // Language Detection
  const lang = navigator.language || navigator.userLanguage;

  let welcome = "Welcome";
  let desc = "A simple protected demo system with dashboard and pages.";

  if (lang.startsWith("el")) {
    welcome = "Καλώς ήρθες";
    desc = "Ένα απλό προστατευμένο demo σύστημα με dashboard και σελίδες.";
  }

  if (lang.startsWith("fr")) {
    welcome = "Bienvenue";
    desc = "Un système démo protégé simple avec tableau de bord et pages.";
  }

  window.onload = () => {
    document.getElementById("welcomeMsg").innerText = welcome;
    document.getElementById("descMsg").innerText = desc;
  };

  // PWA Service Worker
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>

</body>
</html>
