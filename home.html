<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <!-- Mobile Fix: No zoom, perfect responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <meta name="application-name" content="VNF family-shop-v1">
  <title>Home</title>

  <style>
    /* Smooth transitions */
    body, button, a {
      transition: all 0.25s ease;
    }

    /* Light / Dark Mode */
    body.light { background:#f8fafc; color:#1e293b; }
    body.dark  { background:#0f172a; color:#e2e8f0; }

    /* Premium header */
    .vnf-header {
      text-align:center;
      font-size:26px;
      font-weight:800;
      margin-top:25px;
      margin-bottom:25px;
      opacity:0.9;
      letter-spacing:0.5px;
    }

    /* Main container (PREMIUM MOBILE FIX) */
    .vnf-container {
      max-width:480px;
      margin:0 auto;
      padding:12px;
      text-align:center;
    }

    /* Buttons */
    button {
      padding:12px 18px;
      border:none;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
      margin:8px;
      box-shadow:0 2px 6px rgba(0,0,0,0.15);
    }

    button:hover {
      transform:scale(1.03);
      box-shadow:0 4px 10px rgba(0,0,0,0.25);
    }

    /* Welcome box */
    .welcome-box {
      background:#ffffff;
      padding:20px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.15);
      margin-top:20px;
      text-align:center;
    }

    body.dark .welcome-box {
      background:#1e293b;
      color:#e2e8f0;
    }

    /* Mobile polish */
    @media (max-width: 480px) {
      .vnf-header { font-size:22px; }
      button { padding:10px 14px; }
      body { font-size:14px; }
    }

    footer {
      margin-top:30px;
      font-size:12px;
      color:#777;
      text-align:center;
      line-height:1.4;
    }
  </style>
</head>

<body class="light">

<div class="vnf-container">

  <div class="vnf-header">VNF Family Shop v1</div>

  <div class="welcome-box">
    <h2>Welcome</h2>
    <p>Your family shop management system.</p>

    <button style="background:#38bdf8; color:white;" onclick="goLogin()">Login</button>

    <button onclick="toggleMode()">Light / Dark Mode</button>

    <button style="background:#475569; color:white;" onclick="goDashboard()">Dashboard</button>
  </div>

  <footer>
    © 2026 VNF Software — Created by Vasilis Fanes Nikitaras.<br>
    Unauthorized copying or resale is strictly prohibited.<br>
    Contact: vasilis.nikitaras@gmail.com
  </footer>

</div>

<script>
  // Light / Dark Mode
  function toggleMode() {
    const mode = localStorage.getItem("vnf_mode") === "dark" ? "light" : "dark";
    localStorage.setItem("vnf_mode", mode);
    document.body.className = mode;
  }

  document.body.className = localStorage.getItem("vnf_mode") || "light";

  // Navigation
  function goLogin() {
    window.location.href = "login.html";
  }

  function goDashboard() {
    if (localStorage.getItem("vnf_auth") === "ok") {
      window.location.href = "dashboard.html";
    } else {
      alert("Please login first.");
    }
  }
</script>

</body>
</html>
