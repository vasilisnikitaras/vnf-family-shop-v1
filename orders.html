<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Mobile Perfect Scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- PWA Requirements -->
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">

  <meta name="application-name" content="VNF family-shop-v1">
  <title>Orders</title>

  <style>
    body, button, a { transition: all 0.25s ease; }

    body.light { background:#f8fafc; color:#1e293b; }
    body.dark { background:#0f172a; color:#e2e8f0; }

    .vnf-header {
      text-align:center;
      font-size:24px;
      font-weight:800;
      margin-top:25px;
      margin-bottom:25px;
      opacity:0.9;
    }

    .content { text-align:center; margin-top:20px; }

    input, select {
      padding:12px;
      width:260px;
      border-radius:10px;
      border:1px solid #ccc;
      margin-top:10px;
      font-size:16px;
    }

    button {
      padding:12px 18px;
      border:none;
      border-radius:10px !important;
      cursor:pointer;
      margin:10px;
      font-weight:600;
      box-shadow:0 2px 6px rgba(0,0,0,0.15);
    }

    button:hover {
      transform:scale(1.03);
      box-shadow:0 4px 10px rgba(0,0,0,0.25);
    }

    .order-item {
      background:#ffffff;
      padding:15px;
      margin:10px auto;
      width:300px;
      border-radius:12px;
      box-shadow:0 2px 6px rgba(0,0,0,0.15);
      text-align:center;
    }

    body.dark .order-item {
      background:#1e293b;
      color:#e2e8f0;
    }

    footer {
      margin-top:30px;
      font-size:12px;
      color:#777;
      text-align:center;
      line-height:1.4;
    }

    /* Confirm Modal */
    .vnf-modal {
      display:none;
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.55);
      backdrop-filter:blur(3px);
      justify-content:center;
      align-items:center;
      z-index:9999;
    }

    .vnf-modal-content {
      background:white;
      padding:25px;
      border-radius:12px;
      width:300px;
      text-align:center;
      box-shadow:0 4px 20px rgba(0,0,0,0.25);
    }

    body.dark .vnf-modal-content {
      background:#1e293b;
      color:#e2e8f0;
    }

    /* Toast */
    #vnfToastContainer {
      position:fixed;
      top:20px;
      right:20px;
      z-index:99999;
    }

    .vnf-toast {
      background:#1e293b;
      color:white;
      padding:12px 18px;
      margin-top:10px;
      border-radius:10px;
      font-weight:600;
      opacity:0;
      transform:translateX(30px);
      animation:vnfToastIn 0.4s forwards;
    }

    @keyframes vnfToastIn {
      to { opacity:1; transform:translateX(0); }
    }

    .vnf-toast-hide {
      animation:vnfToastOut 0.4s forwards;
    }

    @keyframes vnfToastOut {
      to { opacity:0; transform:translateX(30px); }
    }

    @media (max-width:480px) {
      .vnf-header { font-size:20px; }
      input, select { width:240px; }
      .order-item { width:260px; }
      button { padding:10px 14px; }
    }
  </style>
</head>

<body class="light">

<div class="vnf-header">VNF Family Shop v1</div>

<div class="content">
  <h1 id="titleMsg">Orders</h1>

  <select id="orderStore">
    <option value="">Select Store</option>
  </select>

  <select id="orderProduct">
    <option value="">Select Product</option>
  </select>

  <input id="orderQty" type="number" min="1" placeholder="Quantity">

  <select id="orderStatus">
    <option value="Pending">Pending</option>
    <option value="Completed">Completed</option>
  </select>

  <button onclick="addOrder()" style="background:#38bdf8; color:white;">Add Order</button>
<div id="orderList"></div>

<!-- RESET BUTTONS ΠΟΥ ΕΛΕΙΠΑΝ -->
<div class="bottom-buttons" style="text-align:center; margin-top:20px;">
  <button onclick="resetOrders()" style="background:#ef4444; color:white;">Reset Orders</button>
  <button onclick="resetProducts()" style="background:#f97316; color:white;">Reset Products</button>
  <button onclick="resetStores()" style="background:#3b82f6; color:white;">Reset Stores</button>
</div>


<div class="bottom-buttons" style="text-align:center; margin-top:20px;">
  <button onclick="toggleMode()" style="background:#475569; color:white;">Light / Dark Mode</button>
  <button onclick="logout()" style="background:#ef4444; color:white;">Logout</button>
  <button onclick="window.location.href='dashboard.html'" style="background:#38bdf8; color:white;">Back to Dashboard</button>
  <button onclick="window.location.href='login.html'" style="background:#475569; color:white;">Back to Login</button>
</div>

<!-- Confirm Modal -->
<div id="vnfModal" class="vnf-modal">
  <div class="vnf-modal-content">
    <h3 id="vnfModalTitle">Confirm Action</h3>
    <p id="vnfModalMessage">Are you sure?</p>
    <button id="vnfCancelBtn" style="background:#475569; color:white;">Cancel</button>
    <button id="vnfConfirmBtn" style="background:#ef4444; color:white;">Confirm</button>
  </div>
</div>

<!-- Toast -->
<div id="vnfToastContainer"></div>

<script>
  console.log("push test");   // ← ΒΑΛ’ ΤΟ ΕΔΩ ΓΙΑ ΝΑ ΓΙΝΕΙ PUSH

  /* Protection */
if (localStorage.getItem("vnf_auth") !== "ok") {
  window.location.href = "login.html";
}

/* Mode */
function toggleMode() {
  const mode = localStorage.getItem("vnf_mode") === "dark" ? "light" : "dark";
  localStorage.setItem("vnf_mode", mode);
  document.body.className = mode;
}
document.body.className = localStorage.getItem("vnf_mode") || "light";

/* Language */
const lang = navigator.language || navigator.userLanguage;
if (lang.startsWith("el")) document.getElementById("titleMsg").innerText = "Παραγγελίες";
if (lang.startsWith("fr")) document.getElementById("titleMsg").innerText = "Commandes";

/* ROLES — FULL ACCESS MODE */
let vnfRole = localStorage.getItem("vnf_user");

// Μετατρέπουμε ΟΛΟΥΣ σε admin
if (vnfRole === "family" || vnfRole === "staff") {
  vnfRole = "admin";
}

// FULL ACCESS → δεν χρειάζεται permission check
function vnfCheckPermission(action) {
  return true;
}


/* Toast */
function vnfToast(msg, color="#38bdf8") {
  const box = document.getElementById("vnfToastContainer");
  const t = document.createElement("div");
  t.className = "vnf-toast";
  t.style.background = color;
  t.innerText = msg;
  box.appendChild(t);
  setTimeout(() => {
    t.classList.add("vnf-toast-hide");
    setTimeout(() => t.remove(), 400);
  }, 2500);
}

/* Modal */
let vnfConfirmAction = null;
function vnfConfirm(title, message, callback) {
  document.getElementById("vnfModalTitle").innerText = title;
  document.getElementById("vnfModalMessage").innerText = message;
  vnfConfirmAction = callback;
  document.getElementById("vnfModal").style.display = "flex";
}
document.getElementById("vnfCancelBtn").onclick = () => {
  document.getElementById("vnfModal").style.display = "none";
};
document.getElementById("vnfConfirmBtn").onclick = () => {
  document.getElementById("vnfModal").style.display = "none";
  if (vnfConfirmAction) vnfConfirmAction();
};

/* Load Stores */
let stores = JSON.parse(localStorage.getItem("vnf_stores") || "[]");
let products = JSON.parse(localStorage.getItem("vnf_products") || "[]");
let orders = JSON.parse(localStorage.getItem("vnf_orders") || "[]");

function saveOrders() {
  localStorage.setItem("vnf_orders", JSON.stringify(orders));
}

function loadStores() {
  const sel = document.getElementById("orderStore");
  sel.innerHTML = '<option value="">Select Store</option>';
  stores.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.name || s;
    opt.innerText = s.name || s;
    sel.appendChild(opt);
  });
}

function loadProducts() {
  const sel = document.getElementById("orderProduct");
  sel.innerHTML = '<option value="">Select Product</option>';
  products.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.name;
    opt.innerText = p.name;
    sel.appendChild(opt);
  });
}

loadStores();
loadProducts();

/* Add Order */
function addOrder() {
  if (!vnfCheckPermission("add orders")) return;

  const store = document.getElementById("orderStore").value;
  const product = document.getElementById("orderProduct").value;
  const qty = document.getElementById("orderQty").value;
  const status = document.getElementById("orderStatus").value;

  if (!store || !product || !qty) return alert("Fill all fields");

  orders.push({
    store,
    product,
    qty,
    status,
    addedBy: localStorage.getItem("vnf_user")
  });

  saveOrders();
  renderOrders();
  vnfToast("Order added!", "#10b981");
}

/* Edit Order */
function editOrder(i) {
  if (!vnfCheckPermission("edit orders")) return;

  vnfConfirm("Edit Order", "Are you sure?", () => {
    const newStore = prompt("Store:", orders[i].store);
    const newProduct = prompt("Product:", orders[i].product);
    const newQty = prompt("Qty:", orders[i].qty);
    const newStatus = prompt("Status (Pending/Completed):", orders[i].status);

    if (!newStore || !newProduct || !newQty || !newStatus) return;

    orders[i].store = newStore;
    orders[i].product = newProduct;
    orders[i].qty = newQty;
    orders[i].status = newStatus;

    saveOrders();
    renderOrders();
    vnfToast("Order updated!", "#facc15");
  });
}

/* Delete Order */
function deleteOrder(i) {
  if (!vnfCheckPermission("delete orders")) return;

  vnfConfirm("Delete Order", "Are you sure?", () => {
    orders.splice(i, 1);
    saveOrders();
    renderOrders();
    vnfToast("Order deleted!", "#ef4444");
  });
}

/* Reset Orders */
function resetOrders() {
  vnfConfirm("Reset Orders", "Delete ALL orders?", () => {
    localStorage.removeItem("vnf_orders");
    orders = [];
    renderOrders();
    vnfToast("All orders deleted!", "#ef4444");
  });
}

/* Reset Products */
function resetProducts() {
  vnfConfirm("Reset Products", "Delete ALL products?", () => {
    localStorage.removeItem("vnf_products");
    products = [];
    loadProducts();
    vnfToast("All products deleted!", "#ef4444");
  });
}

/* Reset Stores */
function resetStores() {
  vnfConfirm("Reset Stores", "Delete ALL stores?", () => {
    localStorage.removeItem("vnf_stores");
    stores = [];
    loadStores();
    vnfToast("All stores deleted!", "#ef4444");
  });
}

/* Render Orders */
function renderOrders() {
  const box = document.getElementById("orderList");
  box.innerHTML = "";

  orders.forEach((o, i) => {
    const div = document.createElement("div");
    div.className = "order-item";
    div.innerHTML = `
      <strong>${o.product} (x${o.qty})</strong><br>
      <small>Store: ${o.store}</small><br>
      <small>Status: ${o.status}</small><br>
      <small>Added by: ${o.addedBy || "unknown"}</small><br><br>
      <button onclick="editOrder(${i})" style="background:#38bdf8; color:white;">Edit</button>
      <button onclick="deleteOrder(${i})" style="background:#ef4444; color:white;">Delete</button>
    `;
    box.appendChild(div);
  });
}

renderOrders();

/* Logout */
function logout() {
  localStorage.removeItem("vnf_auth");
  window.location.href = "login.html";
}

/* PWA Service Worker */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}

</script>

</body>
</html>
