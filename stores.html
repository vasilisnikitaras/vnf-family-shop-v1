<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Mobile Perfect Scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- PWA Requirements -->
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">

  <meta name="application-name" content="VNF family-shop-v1">
  <title>Stores</title>

  <style>
    body, button, a { transition: all 0.25s ease; }

    body.light { background:#f8fafc; color:#1e293b; }
    body.dark { background:#0f172a; color:#e2e8f0; }

    .vnf-header {
      text-align:center;
      font-size:24px;
      font-weight:800;
      margin-top:25px;
      margin-bottom:25px;
      opacity:0.9;
    }

    .content { text-align:center; margin-top:20px; }

    input {
      padding:12px;
      width:260px;
      border-radius:10px;
      border:1px solid #ccc;
      margin-top:10px;
      font-size:16px;
    }

    button {
      padding:12px 18px;
      border:none;
      border-radius:10px !important;
      cursor:pointer;
      margin:10px;
      font-weight:600;
      box-shadow:0 2px 6px rgba(0,0,0,0.15);
    }

    button:hover {
      transform:scale(1.03);
      box-shadow:0 4px 10px rgba(0,0,0,0.25);
    }

    .store-item {
      background:#ffffff;
      padding:15px;
      margin:10px auto;
      width:280px;
      border-radius:12px;
      box-shadow:0 2px 6px rgba(0,0,0,0.15);
      text-align:center;
    }

    body.dark .store-item {
      background:#1e293b;
      color:#e2e8f0;
    }

    footer {
      margin-top:30px;
      font-size:12px;
      color:#777;
      text-align:center;
      line-height:1.4;
    }

    /* Modal */
    .vnf-modal {
      display:none;
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.55);
      backdrop-filter:blur(3px);
      justify-content:center;
      align-items:center;
      z-index:9999;
    }

    .vnf-modal-content {
      background:white;
      padding:25px;
      border-radius:12px;
      width:300px;
      text-align:center;
      box-shadow:0 4px 20px rgba(0,0,0,0.25);
    }

    body.dark .vnf-modal-content {
      background:#1e293b;
      color:#e2e8f0;
    }

    /* Toast */
    #vnfToastContainer {
      position:fixed;
      top:20px;
      right:20px;
      z-index:99999;
    }

    .vnf-toast {
      background:#1e293b;
      color:white;
      padding:12px 18px;
      margin-top:10px;
      border-radius:10px;
      font-weight:600;
      opacity:0;
      transform:translateX(30px);
      animation:vnfToastIn 0.4s forwards;
    }

    @keyframes vnfToastIn {
      to { opacity:1; transform:translateX(0); }
    }

    .vnf-toast-hide {
      animation:vnfToastOut 0.4s forwards;
    }

    @keyframes vnfToastOut {
      to { opacity:0; transform:translateX(30px); }
    }

    @media (max-width:480px) {
      .vnf-header { font-size:20px; }
      input { width:240px; }
      .store-item { width:260px; }
      button { padding:10px 14px; }
    }
  </style>
</head>

<body class="light">

<div class="vnf-header">VNF Family Shop v1</div>

<div class="content">
  <h1 id="titleMsg">Stores</h1>

  <input id="storeName" type="text" placeholder="Store name">
  <button onclick="addStore()" style="background:#38bdf8; color:white;">Add Store</button>

  <div id="storeList"></div>
</div>

<div class="bottom-buttons" style="text-align:center; margin-top:20px;">
  <button onclick="toggleMode()" style="background:#475569; color:white;">Light / Dark Mode</button>
  <button onclick="window.location.href='dashboard.html'" style="background:#38bdf8; color:white;">Back to Dashboard</button>
  <button onclick="window.location.href='login.html'" style="background:#ef4444; color:white;">Logout</button>
</div>

<!-- Modal -->
<div id="vnfModal" class="vnf-modal">
  <div class="vnf-modal-content">
    <h3 id="vnfModalTitle">Confirm Action</h3>
    <p id="vnfModalMessage">Are you sure?</p>
    <button id="vnfCancelBtn" style="background:#475569; color:white;">Cancel</button>
    <button id="vnfConfirmBtn" style="background:#ef4444; color:white;">Confirm</button>
  </div>
</div>

<!-- Toast -->
<div id="vnfToastContainer"></div>

<script>
  /* Protection */
  if (localStorage.getItem("vnf_auth") !== "ok") {
    window.location.href = "login.html";
  }

  /* Mode */
  function toggleMode() {
    const mode = localStorage.getItem("vnf_mode") === "dark" ? "light" : "dark";
    localStorage.setItem("vnf_mode", mode);
    document.body.className = mode;
  }
  document.body.className = localStorage.getItem("vnf_mode") || "light";

  /* Language */
  const lang = navigator.language || navigator.userLanguage;
  if (lang.startsWith("el")) document.getElementById("titleMsg").innerText = "Καταστήματα";
  if (lang.startsWith("fr")) document.getElementById("titleMsg").innerText = "Magasins";

  /* Toast */
  function vnfToast(msg, color="#38bdf8") {
    const box = document.getElementById("vnfToastContainer");
    const t = document.createElement("div");
    t.className = "vnf-toast";
    t.style.background = color;
    t.innerText = msg;
    box.appendChild(t);
    setTimeout(() => {
      t.classList.add("vnf-toast-hide");
      setTimeout(() => t.remove(), 400);
    }, 2500);
  }

  /* Modal */
  let vnfConfirmAction = null;
  function vnfConfirm(title, message, callback) {
    document.getElementById("vnfModalTitle").innerText = title;
    document.getElementById("vnfModalMessage").innerText = message;
    vnfConfirmAction = callback;
    document.getElementById("vnfModal").style.display = "flex";
  }
  document.getElementById("vnfCancelBtn").onclick = () => {
    document.getElementById("vnfModal").style.display = "none";
  };
  document.getElementById("vnfConfirmBtn").onclick = () => {
    document.getElementById("vnfModal").style.display = "none";
    if (vnfConfirmAction) vnfConfirmAction();
  };

  /* ROLES */
  const vnfRole = localStorage.getItem("vnf_user");

  function vnfCheckPermission(action) {
    if (vnfRole === "staff") {
      vnfToast("Staff cannot " + action, "#ef4444");
      return false;
    }
    return true;
  }

  /* LocalStorage */
  let stores = JSON.parse(localStorage.getItem("vnf_stores") || "[]");

  function saveStores() {
    localStorage.setItem("vnf_stores", JSON.stringify(stores));
  }

  /* ADD STORE */
  function addStore() {
    if (!vnfCheckPermission("add stores")) return;

    const name = document.getElementById("storeName").value.trim();
    if (!name) return alert("Enter store name");

    const exists = stores.some(s => (s.name || s) === name);
    if (exists) {
      vnfToast("Store already exists!", "#ef4444");
      return;
    }

    stores.push({
      name,
      addedBy: localStorage.getItem("vnf_user")
    });

    saveStores();
    renderStores();
    vnfToast("Store added!", "#38bdf8");
  }

  /* EDIT STORE */
  function editStore(i) {
    if (!vnfCheckPermission("edit stores")) return;

    vnfConfirm("Edit Store", "Are you sure?", () => {
      const newName = prompt("New store name:", stores[i].name || stores[i]);
      if (!newName) return;

      stores[i].name = newName;
      saveStores();
      renderStores();
      vnfToast("Store updated!", "#facc15");
    });
  }

  /* DELETE STORE */
  function deleteStore(i) {
    if (!vnfCheckPermission("delete stores")) return;

    vnfConfirm("Delete Store", "Are you sure?", () => {
      stores.splice(i, 1);
      saveStores();
      renderStores();
      vnfToast("Store deleted!", "#ef4444");
    });
  }

  /* RENDER STORES */
  function renderStores() {
    const box = document.getElementById("storeList");
    box.innerHTML = "";

    stores.forEach((s, i) => {
      const div = document.createElement("div");
      div.className = "store-item";
      div.innerHTML = `
        <span>
          ${s.name || s}
          <br><small>Added by: ${s.addedBy || "unknown"}</small>
        </span>
        <div style="margin-top:10px;">
          <button onclick="editStore(${i})" style="background:#38bdf8; color:white;">Edit</button>
          <button onclick="deleteStore(${i})" style="background:#ef4444; color:white;">Delete</button>
        </div>
      `;
      box.appendChild(div);
    });
  }

  renderStores();

  /* PWA Service Worker */
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>

</body>
</html>
