<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <!-- Mobile Fix: No zoom, perfect responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <meta name="application-name" content="VNF family-shop-v1">
  <title>Dashboard</title>

  <style>
    /* Smooth transitions */
    body, button, a {
      transition: all 0.25s ease;
    }

    /* Light / Dark Mode */
    body.light { background:#f8fafc; color:#1e293b; }
    body.dark  { background:#0f172a; color:#e2e8f0; }

    /* Premium header */
    .vnf-header {
      text-align:center;
      font-size:26px;
      font-weight:800;
      margin-top:25px;
      margin-bottom:25px;
      opacity:0.9;
      letter-spacing:0.5px;
    }

    /* Main container (PREMIUM MOBILE FIX) */
    .vnf-container {
      max-width:480px;
      margin:0 auto;
      padding:12px;
      text-align:center;
    }

    /* Info box */
    .info-box {
      background:#ffffff;
      padding:15px;
      margin:10px 0;
      border-radius:10px;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);
      text-align:left;
    }

    body.dark .info-box {
      background:#1e293b;
      color:#e2e8f0;
    }

    /* Counter boxes */
    .counter-box {
      background:#ffffff;
      padding:15px;
      margin:10px 0;
      border-radius:10px;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);
      font-size:18px;
      font-weight:600;
    }

    body.dark .counter-box {
      background:#1e293b;
      color:#e2e8f0;
    }

    /* Buttons */
    button {
      padding:12px 18px;
      border:none;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
      margin:8px;
      box-shadow:0 2px 6px rgba(0,0,0,0.15);
    }

    button:hover {
      transform:scale(1.03);
      box-shadow:0 4px 10px rgba(0,0,0,0.25);
    }

    /* Mobile polish */
    @media (max-width: 480px) {
      .vnf-header { font-size:22px; }
      button { padding:10px 14px; }
      body { font-size:14px; }
    }

    footer {
      margin-top:30px;
      font-size:12px;
      color:#777;
      text-align:center;
      line-height:1.4;
    }
  </style>
</head>

<body class="light">

<div class="vnf-container">

  <div class="vnf-header">Dashboard</div>

  <!-- Info Section -->
  <div class="info-box">
    <strong>Family Code:</strong> FNF-TEST-001<br>
    <strong>Family ID:</strong> fam-001<br>
    <strong>Device ID:</strong> dev-001
  </div>

  <!-- Counters -->
  <div class="counter-box">Stores: <span id="storesCount">3</span></div>
  <div class="counter-box">Products: <span id="productsCount">3</span></div>
  <div class="counter-box">Orders: <span id="ordersCount">2</span></div>

  <!-- Navigation -->
  <div class="bottom-buttons">
    <button onclick="window.location.href='stores.html'" style="background:#38bdf8; color:white;">Stores</button>
    <button onclick="window.location.href='products.html'" style="background:#38bdf8; color:white;">Products</button>
    <button onclick="window.location.href='orders.html'" style="background:#38bdf8; color:white;">Orders</button>
    <button onclick="window.location.href='settings.html'" style="background:#475569; color:white;">Settings</button>
    <button onclick="window.location.href='users.html'" style="background:#475569; color:white;">Users</button>
    <button onclick="toggleMode()">Light / Dark Mode</button>
    <button onclick="logout()" style="background:#ef4444; color:white;">Logout</button>
  </div>

  <footer>
    © 2026 VNF Software — Created by Vasilis Fanes Nikitaras.<br>
    Unauthorized copying or resale is strictly prohibited.<br>
    Contact: vasilis.nikitaras@gmail.com
  </footer>

</div>

<script>
  // Protection
  if (localStorage.getItem("vnf_auth") !== "ok") {
    window.location.href = "login.html";
  }

  // Light / Dark Mode
  function toggleMode() {
    const mode = localStorage.getItem("vnf_mode") === "dark" ? "light" : "dark";
    localStorage.setItem("vnf_mode", mode);
    document.body.className = mode;
  }

  document.body.className = localStorage.getItem("vnf_mode") || "light";

  // Logout
  function logout() {
    localStorage.removeItem("vnf_auth");
    window.location.href = "login.html";
  }
</script>

</body>
</html>
